name: velin-music

x-backend-image: &backend-image
  # 公开 clone 与精简部署包默认只拉取 CI 已构建并签名的镜像；公开源码仅供审计或复建，不挂入容器。
  image: ${VELIN_BACKEND_IMAGE:-ghcr.io/your-org/velin-music:1.0.0}

services:
  backend:
    <<: *backend-image
    container_name: velin-music
    restart: unless-stopped
    init: true
    # Webman 以 root 读取不同宿主 UID 的媒体挂载；容器仍不启用 privileged，也不挂载 Docker Socket、
    # 设备或宿主进程命名空间。该权限只解决明确挂载目录的文件访问，不扩大容器可见范围。
    user: "0:0"
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 公开部署与源码部署使用同一两根布局：应用状态统一进入 /data，音乐、下载和回收站进入 /storage。
      # 两个宿主根由公开 clone 或精简部署包预置，缺失时必须失败，不能静默生成空库或空音乐目录。
      - type: bind
        source: ./docker-data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./storage
        target: /storage
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r 'exit(PHP_VERSION_ID >= 80300 && PHP_VERSION_ID < 80400 && extension_loaded("gd") && extension_loaded("openssl") && trim((string) ini_get("disable_functions")) === "" ? 0 : 1);'
          && /app/bin/ffprobe -version >/dev/null 2>&1
          && /app/bin/ffmpeg -version >/dev/null 2>&1
          && node --version >/dev/null 2>&1
          && /app/bin/velin-library-watch-helper --version >/dev/null 2>&1
          && /app/bin/velin-dlna-helper --version >/dev/null 2>&1
          && test -x /app/bin/velin-airplay-companion
          && test -x /usr/sbin/owntone
          && test -x /usr/sbin/avahi-daemon
          && test -x /usr/bin/dbus-daemon
          && test -x /app/bin/velin-redis-companion
          && test -x /usr/bin/redis-server
          && test -x /usr/bin/redis-cli
          && test -r /etc/owntone/owntone.conf
          && test -r /usr/share/licenses/owntone/COPYING
          && test "$$(/app/bin/velin-media-gateway --version)" = 'velin-media-gateway protocol=1 static=1'
          && test -r /app/bin/webdav-range-proxy.php
          && php -l /app/bin/webdav-range-proxy.php >/dev/null 2>&1
          && /app/bin/fpcalc -version >/dev/null 2>&1
          && test -x /app/bin/opencc
          && test -r /app/bin/opencc-data/t2s.json
          && test -r /app/bin/opencc-data/tw2s.json
          && test -r /app/public/index.html
          && test "$$(printf '周杰倫 - 稻香 Live現場版\n' | /app/bin/opencc -c /app/bin/opencc-data/t2s.json)" = '周杰伦 - 稻香 Live现场版'
          && test "$$(printf '活著多好 - 陳奕迅\n' | /app/bin/opencc -c /app/bin/opencc-data/tw2s.json)" = '活着多好 - 陈奕迅'
          && test "$$(redis-cli -h 127.0.0.1 -p 27379 ping)" = PONG
          && wget -qO- http://127.0.0.1:8787/api/v1/health >/dev/null
          && wget -qS -O /dev/null http://127.0.0.1:8787/index.html 2>&1 | grep -Fi 'X-Velin-Static-Delivery: go' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
