# Velin Music 内置 AirPlay companion 配置。
#
# OwnTone 只承担 mDNS、音频解码和 AirPlay 传输，不扫描或管理 Velin 媒体。HTTP JSON API 固定绑定宿主
# 回环地址，局域网客户端不能绕过 Webman 权限直接改队列。容器以 root 运行是为了让命名卷首次启动即可
# 写缓存；它没有 Docker socket、宿主媒体根或额外 capabilities，/srv/media 只是空的只读占位目录。
# OwnTone 用同一个 bind_address 同时选择 mDNS/AirPlay 网卡和 HTTP 监听，不能绑定 127.0.0.1，否则只能
# 浏览 lo。这里使用默认全接口监听，但 trusted_networks 只信任 localhost，局域网 HTTP 请求固定返回 403；
# Velin 客户端仍只连接 127.0.0.1，不向浏览器公开 companion 地址。
general {
	uid = "root"
	db_path = "/var/cache/owntone/database.db"
	cache_dir = "/var/cache/owntone"
	logfile = "/dev/stderr"
	loglevel = log
	trusted_networks = { "localhost" }
	ipv6 = no
	speaker_autoselect = no
}

library {
	name = "Velin Music AirPlay"
	port = 3689
	directories = { "/srv/media" }
	filescan_disable = true
	clear_queue_on_stop_disable = false
}

audio {
	type = "disabled"
}
