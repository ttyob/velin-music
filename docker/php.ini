; Velin Music container runtime policy.
; Workerman's monitor and Symfony Process require process-control functions. The deployment owner
; explicitly requested no PHP function blacklist; command execution remains constrained in code by
; argument arrays, fixed executable paths, timeouts, output limits, and path revalidation.
disable_functions =

date.timezone = Asia/Shanghai
memory_limit = 512M
max_execution_time = 0
expose_php = Off
display_errors = Off
log_errors = On

; Webman is a long-running CLI application, so OPcache must be enabled for CLI workers explicitly.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Upload endpoints are not implemented yet, but bounded defaults prevent future PHP parsing from
; silently accepting payloads larger than the current Webman request limit.
upload_max_filesize = 64M
post_max_size = 64M
